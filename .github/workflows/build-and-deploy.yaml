name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Keep deployments reproducible; update this deliberately after
          # testing a production build locally with the same Hugo version.
          hugo-version: "0.164.0"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify --gc --cleanDestinationDir --printI18nWarnings --panicOnWarning

      - name: Test CV download validation
        run: python3 scripts/test-fetch-cvs.py

      # PDFs are downloaded only into the temporary deployment artifact.
      - name: Add current CVs to deployment
        run: python3 scripts/fetch-cvs.py

      - name: Check translated pages and CVs
        run: python3 scripts/check-site.py --require-cvs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
