{{ define "main" }}
  <main id="main-content" class="page">
    <header class="page-header">
      <p class="eyebrow">{{ .Section | humanize }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    </header>
    <article class="prose">
      {{ .Content }}
    </article>
  </main>
{{ end }}
