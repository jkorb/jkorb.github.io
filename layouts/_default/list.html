{{ define "main" }}
  <main id="main-content" class="page">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
    </header>
    <ul class="page-list">
      {{ range .Pages }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Description }}<span>{{ . }}</span>{{ end }}
        </li>
      {{ end }}
    </ul>
  </main>
{{ end }}
